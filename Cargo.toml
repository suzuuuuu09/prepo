[package]
name = "prepo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Preflight checks for development repositories."
repository = "https://github.com/suzuuuuu09/prepo"
autolib = false

[[bin]]
name = "prepo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "gzip"] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "signal", "sync", "time"] }
toml = "0.8.23"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
